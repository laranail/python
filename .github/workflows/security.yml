name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so an advisory published after the last commit is still found.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Packagist's advisory endpoint 502s often enough to red-build a clean
      # repository. --ignore-unreachable keeps a fetch failure from being
      # reported as a vulnerability; a real advisory still fails the job.
      - run: composer audit --ignore-unreachable
