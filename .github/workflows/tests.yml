name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13']
        stability: [prefer-stable]
        include:
          # One lowest-dependency run on the floor. This is what catches a
          # constraint claiming a floor the code does not actually hold to.
          - php: '8.4'
            laravel: '13'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

  # The process transport is excluded from the default suite because it needs a
  # real interpreter. Excluding it and never running it anywhere would mean the
  # security clamp is asserted only against fixtures that PHP happens to run, so
  # it gets its own job with actual Python.
  process:
    name: Process transport · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      # The id is load-bearing: the step below reads
      # steps.setup-python.outputs.python-path, and without it that resolves to
      # an empty string. The suite then falls back to whatever `python3` is on
      # PATH, which is not the matrix version this job exists to test.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the process-transport suite
        env:
          LARANAIL_PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: vendor/bin/pest --ci --group=python

  boot-health:
    name: Boot health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Every binding resolves after a normal boot
        run: vendor/bin/pest --ci --filter=BootHealthTest
